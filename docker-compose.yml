services:
  api:
    build: .
    container_name: agriculture-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: agriculture-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-agriculture_inventory}
      MYSQL_USER: ${DB_USER:-abdo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD $$MYSQL_DATABASE -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./src/infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/infrastructure/database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro

  nginx:
    image: nginx:alpine
    container_name: agriculture-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  db_data:
